# We use the National Instruments GPIB-USB-HS, driven by the ni_usb_gpib module.
# lpvo_usb_gpib is a driver for a DIFFERENT (FTDI-based, 0403:6001) adapter we do
# not own. It was getting auto-loaded and sitting on gpib_common alongside
# ni_usb_gpib for no reason — a needless second GPIB driver and a possible source
# of board/minor-number confusion. Blacklist it so only ni_usb_gpib is ever loaded.
#
# Install (one-time, needs root):
#   sudo cp he3_pressure_reader/udev/blacklist-lpvo-gpib.conf /etc/modprobe.d/
#   sudo rmmod lpvo_usb_gpib        # unload it now (harmless; refcount is 0)
#   sudo depmod -a
# It stays unloaded across reboots thereafter.
blacklist lpvo_usb_gpib
